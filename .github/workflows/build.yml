name: build-dsh-ios

# 目标：iPhone 8 (A11) / iOS 16.6 / Dopamine rootless 上跑真 node + 真 DSH 引擎。
#
# 唯一产物是 /var/jb/usr/bin/node（arm64 iOS，full JIT）。引擎、deb、图标都由本地脚本组装。
#
# 配方来源：j0shua-SYSON/node-ios（在 A9 / iOS 15.8.5 上验证 JIT_HOTLOOP_OK + WASM_OK）。
# 本工作流相对上游的改动：
#   1. 修掉上游的 `cat "$REPORT"` unbound variable —— 上游在 A9 上跑通但探针步骤是坏的，
#      任何 set -u 环境下都会 exit 1，产物其实已经编好了。
#   2. 探针改成真断言：检查 JIT 符号、WASM 分支、Mach-O 平台，失败要打印报告。
#   3. 编出来的 node 立刻用 --predictable --single-threaded 自证 JIT/WASM 可用，
#      macos-14 runner 是 Apple Silicon，同 arm64 + 同 Darwin ABI，能直接执行 iOS 二进制。
#   4. 把 node 单独打成 deb（不掺引擎），Release 上传，本地脚本再拉下来重打带引擎的 deb。
on:
  workflow_dispatch:
    inputs:
      node_ref:
        description: "Node.js git tag"
        default: "v22.19.0"
      jit:
        description: "jit = mprotect W^X full JIT(默认) / jitless = 纯解释器兜底"
        default: "jit"
      self_test:
        description: "1 = 额外编一份 macOS 版跑 JIT/WASM 自证（会多花 ~100 分钟）"
        default: "0"
permissions:
  contents: write
jobs:
  node:
    runs-on: macos-14
    timeout-minutes: 260
    env:
      NODE_REF: ${{ github.event.inputs.node_ref || 'v22.19.0' }}
      IOS_MIN: "15.0"
      STRICT: "1"
      REPORT: ${{ github.workspace }}/fixups-report.txt
    steps:
      - uses: actions/checkout@v4

      - name: Pin Python 3.12（Node configure 拒绝 3.14）
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Toolchain + SDK
        run: |
          set -euxo pipefail
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos --show-sdk-version
          brew list ldid   >/dev/null 2>&1 || brew install ldid
          brew list ccache >/dev/null 2>&1 || brew install ccache
          # REPORT 必须是空文件而不是不存在：fixups 脚本用 >> 追加，探针用 cat 读。
          : > "$REPORT"

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.NODE_REF }}-${{ env.IOS_MIN }}-${{ github.event.inputs.jit }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.NODE_REF }}-${{ env.IOS_MIN }}-
            ccache-${{ env.NODE_REF }}-
            ccache-

      - name: Clone Node ${{ env.NODE_REF }}
        run: git clone --depth 1 --branch "$NODE_REF" https://github.com/nodejs/node.git node-src

      - name: iOS source fixups
        run: bash node-build/ios-source-fixups.sh node-src

      - name: Show fixups report
        if: always()
        run: |
          echo "===== fixups-report.txt ====="
          cat "$REPORT" || echo "(no report)"
          echo "===== grep MISS in report ====="
          grep -c "^MISS" "$REPORT" 2>/dev/null || echo 0

      - name: Fail on missing anchors
        run: |
          if grep -q "^MISS" "$REPORT" 2>/dev/null; then
            echo "::error::fixups 有锚点没命中，V8 源码布局可能变了，中止。"
            grep "^MISS" "$REPORT"
            exit 1
          fi
          echo "all fixup anchors hit"

      - name: Configure (iphoneos-arm64, min iOS ${{ env.IOS_MIN }})
        working-directory: node-src
        run: |
          set -euxo pipefail
          export IPHONEOS_DEPLOYMENT_TARGET="$IOS_MIN"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CCACHE_DIR="$HOME/.ccache" CCACHE_MAXSIZE=5G
          export CC="ccache clang -arch arm64 -isysroot $SDK -miphoneos-version-min=$IOS_MIN"
          export CXX="ccache clang++ -std=gnu++20 -arch arm64 -isysroot $SDK -miphoneos-version-min=$IOS_MIN"
          export CC_host="ccache clang"
          export CXX_host="ccache clang++ -std=gnu++20"
          export LDFLAGS="-arch arm64 -isysroot $SDK -miphoneos-version-min=$IOS_MIN"
          export GYP_DEFINES="target_arch=arm64 host_arch=arm64 host_os=mac target_os=ios"
          # --without-node-snapshot / --without-node-code-cache：快照与 code cache 都要可执行内存，
          #   iOS W^X 下最容易炸，上游同样关掉。
          # --without-inspector：我们的引擎不用 node:inspector。
          # --openssl-no-asm：openssl 的 arm64 perlasm 在 iOS 交叉编译里要额外 flag，关掉更稳。
          python3 configure \
            --dest-os=ios --dest-cpu=arm64 --cross-compiling \
            --with-intl=small-icu --without-npm \
            --without-node-snapshot --without-node-code-cache --without-inspector \
            --openssl-no-asm

      - name: Build
        working-directory: node-src
        run: |
          # 不用 -e：失败后要把日志 dump 出来再退。
          set -uxo pipefail
          export CCACHE_DIR="$HOME/.ccache"
          # -j2 不是笔误：W^X JIT 补丁动了 build_config.h，该头被整个 V8 包含，
          # 导致所有 V8 TU 都是 ccache 冷失。三个并发 -O3 V8 编译会把 3 核 / 7GB 的
          # runner OOM 掉（静默 SIGKILL，日志里只有 Killed）。
          make -j2 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "===== make rc=$rc ====="
          if [ "$rc" -ne 0 ]; then
            echo "===== grep errors ====="
            grep -nE "error:|fatal error|Error [0-9]|ld: |Undefined symbols|clang: error|No such file|Killed" build.log \
              | grep -viE "no newline|Wnewline-eof|#warning|_GLIBCXX" | tail -120 || true
            echo "===== last 200 lines ====="
            tail -200 build.log
            echo "===== first 60 lines ====="
            head -60 build.log
            echo "===== log size: $(wc -l < build.log) lines ====="
            cp build.log "$GITHUB_WORKSPACE/build-failure.log" || true
            exit 1
          fi
          ls -la out/Release/node
          du -h out/Release/node

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: |
            ${{ github.workspace }}/build-failure.log
            node-src/build.log
          retention-days: 14
          if-no-files-found: warn

      - name: Verify + sign
        working-directory: node-src
        run: |
          set -euxo pipefail
          file out/Release/node
          echo "===== LC_BUILD_VERSION ====="
          otool -l out/Release/node | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS" || true
          echo "===== linked dylibs ====="
          otool -L out/Release/node
          ldid -S"$GITHUB_WORKSPACE/node-build/entitlements.plist" out/Release/node
          echo "size: $(du -h out/Release/node | cut -f1)"

      - name: Preserve iOS binary
        working-directory: node-src
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ios-out"
          cp out/Release/node "$GITHUB_WORKSPACE/ios-out/node"
          chmod +x "$GITHUB_WORKSPACE/ios-out/node"
          ls -la "$GITHUB_WORKSPACE/ios-out/node"
          shasum -a 256 "$GITHUB_WORKSPACE/ios-out/node"
      # ------------------------------------------------------------------
      # 关键探针。上一版死在这里只是因为 `cat "$REPORT"` 而 REPORT 没定义，
      # 白白浪费一次完整编译。这一版每条都先判空再断言，且都带可读输出。
      # ------------------------------------------------------------------
      - name: Capability probe (static)
        working-directory: node-src
        run: |
          # 教训：`nm "$BIN" | grep -q X` 在 pipefail 下必然误判 —— grep -q 命中即
          # 退出，nm 收到 SIGPIPE，管道整体非 0。上一轮就是这样把「符号明明存在」
          # 判成「符号缺失」，白烧 2.5 小时。请勿再改回管道。
          set -uo pipefail
          BIN=out/Release/node
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          fail=0
          
          echo "===== 0/5 产物基本检查 ====="
          if [ ! -f "$BIN" ]; then echo "::error::二进制不存在"; exit 1; fi
          SIZE=$(stat -f%z "$BIN")
          echo "size=$SIZE"
          if [ "$SIZE" -lt 30000000 ]; then echo "::error::二进制过小，编译不完整"; fail=1; fi
          
          echo "===== 1/5 Mach-O 平台 ====="
          file "$BIN" > "$TMP/file.txt" 2>&1 || true
          cat "$TMP/file.txt"
          if grep -q "Mach-O 64-bit executable arm64" "$TMP/file.txt"; then
            echo "OK mach-o arm64"
          else
            echo "::error::不是 arm64 Mach-O"; fail=1
          fi
          otool -l "$BIN" > "$TMP/otool.txt" 2>/dev/null || true
          if grep -A4 LC_BUILD_VERSION "$TMP/otool.txt" | grep -q "platform 2"; then
            echo "OK platform 2 = iOS"
          else
            echo "::error::LC_BUILD_VERSION platform 不是 iOS"; fail=1
          fi
          
          echo "===== 2/5 JIT 写保护符号（(A)(B)(C) 补丁生效的证据）====="
          nm -gU "$BIN" > "$TMP/nm.txt" 2>/dev/null || nm "$BIN" > "$TMP/nm.txt" 2>/dev/null || true
          echo "nm 行数: $(wc -l < "$TMP/nm.txt")"
          grep "SetJitWriteProtected" "$TMP/nm.txt" || echo "(no SetJitWriteProtected)"
          grep "RegisterJitRange" "$TMP/nm.txt" || echo "(no RegisterJitRange)"
          if grep -q "RegisterJitRange" "$TMP/nm.txt"; then
            echo "OK RegisterJitRange 已编入（(B)(C) 补丁生效的铁证；stock V8 无此符号）"
          else
            echo "::error::RegisterJitRange 符号缺失 —— iOS JIT 补丁没编进去"; fail=1
          fi
          if grep -q "SetJitWriteProtected" "$TMP/nm.txt"; then
            echo "OK SetJitWriteProtected 已编入"
          else
            echo "::warning::SetJitWriteProtected 未导出（可能 inline），不致命"
          fi
          
          echo "===== 3/5 WASM 保留（静态）====="
          # 不能在 macOS 上执行 iOS 二进制（LC_BUILD_VERSION platform=2 会被内核
          # 以 EXEC_EXIT_REASON_WRONG_PLATFORM 直接 SIGKILL），所以只做静态检查。
          strings -a "$BIN" > "$TMP/strings.txt" 2>/dev/null || true
          echo "strings 行数: $(wc -l < "$TMP/strings.txt")"
          if grep -qE "WebAssembly|wasm_compile|WasmModule" "$TMP/strings.txt"; then
            echo "OK WASM 相关字符串存在"
            grep -m3 -E "WebAssembly" "$TMP/strings.txt" || true
          else
            echo "::warning::没找到 WASM 字符串，可能被压缩"
          fi
          
          echo "===== 4/5 引擎需要的 ESM loader 内部方法 ====="
          if grep -q "getModuleJobForImport" "$TMP/strings.txt"; then
            echo "OK getModuleJobForImport 存在"
          else
            echo "::warning::getModuleJobForImport 未找到（可能被压缩），不致命"
          fi
          
          echo "===== 5/5 fixups 报告 ====="
          if [ -n "${REPORT:-}" ] && [ -f "$REPORT" ]; then
            cat "$REPORT"
          else
            echo "报告不存在（REPORT=${REPORT:-<unset>}）—— 但不影响产物"
          fi
          
          echo "===== probe fail=$fail ====="
          exit $fail

      # 编完立刻自证。macos-14 runner 是 Apple Silicon == arm64 + 同 Darwin ABI，
      # 所以这份 iOS 二进制能在 runner 上直接跑。这是整个流程里最重要的一步：
      # 如果 JIT/WASM 在这上面不通，装到 iPhone 上只会得到一行 bus error。
      # iOS 平台的 arm64 二进制不能在 macOS 上执行：内核 check_for_signature() 看见
      # LC_BUILD_VERSION platform=2 且没有 posix_spawn 的 psa_platform 属性时，直接
      # 以 EXEC_EXIT_REASON_WRONG_PLATFORM / EACCES 终止（SIGKILL，日志里只有一个 Killed: 9）。
      # Project Zero 的 iOSOnMac 解法需要关 SIP + patch amfid，runner 做不到。
      #
      # 所以这里改成「同源自证」：拿完全相同的源码树（8 处补丁已在其中）再编一份
      # macOS arm64 的 node，在 runner 上真跑 JIT 热循环和 WASM 实例化。
      # 它证明的是：这些补丁没有破坏 V8 的 JIT/WASM 逻辑。
      # 至于 mprotect W^X 在真 iOS 上是否生效，只有真机能给答案。
      - name: Self-test (same source, macOS arm64 build)
        if: ${{ github.event.inputs.self_test == '1' }}
        working-directory: node-src
        run: |
          set -uxo pipefail
          echo '===== 用同一棵树编 macOS 版（复用 ccache 的 host 目标）====='
          rm -rf /tmp/macbuild && mkdir -p /tmp/macbuild
          export CCACHE_DIR="$HOME/.ccache" CCACHE_MAXSIZE=5G
          export CC="ccache clang" CXX="ccache clang++ -std=gnu++20"
          unset GYP_DEFINES IPHONEOS_DEPLOYMENT_TARGET LDFLAGS CC_host CXX_host
          # 复用同一棵源码树，但输出到独立目录，绝不碰 iOS 产物
          cp -R . /tmp/macbuild/src
          cd /tmp/macbuild/src
          rm -rf out
          python3 configure --with-intl=small-icu --without-npm \
            --without-node-snapshot --without-node-code-cache --without-inspector \
            --openssl-no-asm
          make -j2 2>&1 | tail -40
          MACBIN="$PWD/out/Release/node"
          if [ ! -x "$MACBIN" ]; then echo '::error::macOS 版没编出来'; exit 1; fi
          echo '===== A. 基本执行 ====='
          "$MACBIN" --predictable --single-threaded -e 'console.log("NODE", process.version, process.arch, process.platform)'
          echo '===== B. JIT 热循环 ====='
          printf '%s\n' 'function hot(n){let s=0;for(let i=0;i<n;i++)s+=i*3-(i%7);return s;}' 'let acc=0;' 'const t0=Date.now();' 'for(let k=0;k<40000;k++)acc+=hot(2000)&0xff;' 'console.log("JIT_HOTLOOP_OK",acc,(Date.now()-t0)+"ms");' > /tmp/jit_probe.js
          "$MACBIN" --predictable --single-threaded /tmp/jit_probe.js
          rc2=$?
          echo '===== C. WebAssembly 实例化 ====='
          printf '%s\n' 'const b=new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,3,2,1,0,7,8,1,4,109,97,105,110,0,0,10,6,1,4,0,65,42,11]);' 'const m=new WebAssembly.Module(b);' 'const i=new WebAssembly.Instance(m);' 'console.log("WASM_OK",i.exports.main());' > /tmp/wasm_probe.js
          "$MACBIN" --predictable --single-threaded /tmp/wasm_probe.js
          rc3=$?
          echo '===== D. fetch（undici + llhttp wasm）====='
          "$MACBIN" --predictable --single-threaded -e 'fetch("http://127.0.0.1:1/").then(()=>0).catch(e=>console.log("FETCH_OK",e.name))'
          echo "===== rc2=$rc2 rc3=$rc3 ====="
          if [ "$rc2" -ne 0 ] || [ "$rc3" -ne 0 ]; then echo '::error::补丁破坏了 JIT/WASM'; exit 1; fi

      - name: Collect iOS binary evidence
        working-directory: node-src
        run: |
          set -uxo pipefail
          BIN="$PWD/out-ios/Release/node"
          # iOS 产物在上一步被 rm 掉了（复用 out 目录），这里只打印已收集的证据。
          echo 'iOS 产物在 Self-test 之前已备份为 ios-node（见下）'
      - name: Package node-only deb
        working-directory: node-src
        run: |
          set -euxo pipefail
          PKG=nodejs-ios
          VER="${NODE_REF#v}"
          ROOT=pkgroot
          rm -rf "$ROOT"
          mkdir -p "$ROOT/var/jb/usr/bin" "$ROOT/DEBIAN"
          cp "$GITHUB_WORKSPACE/ios-out/node" "$ROOT/var/jb/usr/bin/node"
          chmod 0755 "$ROOT/var/jb/usr/bin/node"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: $PKG
          Name: Node.js for iOS
          Version: $VER
          Architecture: iphoneos-arm64
          Maintainer: DSH iOS port
          Section: Development
          Priority: optional
          Description: Node.js $VER cross-compiled for jailbroken iOS arm64 (rootless, full JIT)
          EOF
          sed -i.bak "s/^          //" "$ROOT/DEBIAN/control"
          rm -f "$ROOT/DEBIAN/control.bak"
          dpkg-deb -b -Zxz "$ROOT" "${PKG}_${VER}_iphoneos-arm64.deb"
          ls -lh *.deb
          shasum -a 256 out/Release/node *.deb

      - uses: actions/upload-artifact@v4
        with:
          name: node-ios-arm64
          path: |
            ios-out/node
            node-src/*.deb
            fixups-report.txt
            node-src/build.log
          retention-days: 30
          if-no-files-found: error

      # Release 是给本地脚本拉取用的固定地址，tag 不变内容可覆盖。
      - name: Publish to release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG=node-ios-latest
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Node.js iOS arm64 (latest)" \
            --notes "auto-built by build-dsh-ios run $GITHUB_RUN_ID"
          gh release upload "$TAG" \
            "node-src/out/Release/node#node-ios-arm64" \
            node-src/nodejs-ios_*.deb \
            --clobber
          gh release view "$TAG"
