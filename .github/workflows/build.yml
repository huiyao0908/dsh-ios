name: build-dsh-ios

# 两段式：
#   job node  —— 按 j0shua-SYSON/node-ios 的配方交叉编译 Node 24（iOS arm64，全 JIT）
#   job ipa   —— 把 Node + DSH 引擎 + Swift 壳 组装成未签名 IPA
#
# 配方来源：https://github.com/j0shua-SYSON/node-ios
#   上游在 iPhone 6s Plus (A9) / iOS 15.8.5 / Dopamine 上验证通过
#   （JIT_HOTLOOP_OK, WASM_OK 42）。我们的目标是 A11 (iPhone 8) / iOS 16.6 / Dopamine，
#   同一 rootless 越狱、同一 W^X 机制，兼容。
#
# 为什么不用 nodejs-mobile：
#   它把 child_process/cluster 砍掉、把 process.platform 改成 'ios'。
#   dsh 的 subprocess 层 / tool-bash / job / terminal / 插件安装全走 spawn，
#   且引擎的 createProcessInspector 只认 'darwin'。
on:
  workflow_dispatch:
    inputs:
      node_ref:
        description: "Node.js git tag"
        default: "v24.9.0"
      build_ipa:
        description: "1 = 同时打 IPA"
        default: "1"
      jit:
        description: "jit = 全 JIT(默认) / jitless = 纯解释器兜底"
        default: "jit"
permissions:
  contents: write
jobs:
  node:
    runs-on: macos-14            # arm64 host == arm64 target
    timeout-minutes: 180
    env:
      NODE_REF: ${{ github.event.inputs.node_ref || 'v24.9.0' }}
      IOS_MIN: "15.0"
      STRICT: "0"                # 锚点漂移不中断，末尾看报告
    steps:
      - uses: actions/checkout@v4
      - name: Pin Python 3.12（Node configure 拒绝 3.14）
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Toolchain + SDK
        run: |
          set -euxo pipefail
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos --show-sdk-version
          brew list ldid   >/dev/null 2>&1 || brew install ldid
          brew list ccache >/dev/null 2>&1 || brew install ccache
      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.NODE_REF }}-${{ env.IOS_MIN }}-${{ env.STRICT }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.NODE_REF }}-${{ env.IOS_MIN }}-
            ccache-${{ env.NODE_REF }}-
            ccache-
      - name: Clone Node ${{ env.NODE_REF }}
        run: git clone --depth 1 --branch "$NODE_REF" https://github.com/nodejs/node.git node-src
      - name: iOS source fixups
        env:
          REPORT: ${{ github.workspace }}/fixups-report.txt
        run: bash node-build/ios-source-fixups.sh node-src
      - name: Configure (iphoneos-arm64, min iOS ${{ env.IOS_MIN }})
        working-directory: node-src
        run: |
          set -euxo pipefail
          export IPHONEOS_DEPLOYMENT_TARGET="$IOS_MIN"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CCACHE_DIR="$HOME/.ccache" CCACHE_MAXSIZE=5G
          export CC="ccache clang -arch arm64 -isysroot $SDK -miphoneos-version-min=$IOS_MIN"
          export CXX="ccache clang++ -std=gnu++20 -arch arm64 -isysroot $SDK -miphoneos-version-min=$IOS_MIN"
          export CC_host="ccache clang"
          export CXX_host="ccache clang++ -std=gnu++20"
          export LDFLAGS="-arch arm64 -isysroot $SDK -miphoneos-version-min=$IOS_MIN"
          export GYP_DEFINES="target_arch=arm64 host_arch=arm64 host_os=mac target_os=ios"
          # --with-intl=small-icu: 引擎源码里可能有 \p{...} 正则；small-icu 比 none 稳。
          # --without-node-snapshot / --without-node-code-cache: 快照与 code cache
          #   都涉及可执行内存，iOS W^X 下容易出问题，上游也是这么关的。
          python3 configure \
            --dest-os=ios --dest-cpu=arm64 --cross-compiling \
            --with-intl=small-icu --without-npm \
            --without-node-snapshot --without-node-code-cache --without-inspector \
            --openssl-no-asm
      - name: Build
        working-directory: node-src
        run: |
          set -uxo pipefail
          export CCACHE_DIR="$HOME/.ccache"
          set +e
          # -j2 不是笔误：V8 的 W^X JIT 修补动了 build_config.h 里的宏，
          # 该头被整个 V8 包含，导致所有 V8 TU 都是 ccache 冷失。
          # 三个并发冷 -O3 V8 编译会把 3 核 / 7GB 的 runner OOM 掉（静默 SIGKILL）。
          make -j2 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "make rc=$rc"
          set -e
          if [ "$rc" -ne 0 ]; then
            echo '=== errors ==='
            grep -nE 'error:|fatal error|Error [0-9]|ld: |Undefined symbols|clang: error' build.log \
              | grep -viE 'no newline|Wnewline-eof|#warning|_GLIBCXX' | tail -80
            exit 1
          fi
          ls -la out/Release/node
      - name: Verify + sign
        working-directory: node-src
        run: |
          set -euxo pipefail
          file out/Release/node
          otool -l out/Release/node | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS' || true
          ldid -S../node-build/entitlements.plist out/Release/node
          echo "size: $(du -h out/Release/node | cut -f1)"
      - name: Capability probe (host can't run it; static checks only)
        working-directory: node-src
        run: |
          set -euxo pipefail
          nm -gU out/Release/node 2>/dev/null | grep -c 'SetJitWriteProtected' || true
          strings out/Release/node | grep -m3 -E 'getOrCreateModuleJob|getModuleJobForImport' || echo '（内部方法名可为压缩名，不致命）'
          echo '--- fixups report ---'
          cat "$REPORT" 2>/dev/null || cat ../fixups-report.txt 2>/dev/null || true
      - name: Package into deb (rootless)
        working-directory: node-src
        run: |
          set -euxo pipefail
          PKG=nodejs-ios
          VER="${NODE_REF#v}"
          ROOT=pkgroot
          rm -rf "$ROOT"; mkdir -p "$ROOT/var/jb/usr/bin" "$ROOT/DEBIAN"
          cp out/Release/node "$ROOT/var/jb/usr/bin/node"
          chmod 0755 "$ROOT/var/jb/usr/bin/node"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: $PKG
          Name: Node.js for iOS
          Version: $VER
          Architecture: iphoneos-arm64
          Maintainer: DSH iOS port
          Section: Development
          Priority: optional
          Description: Node.js $VER cross-compiled for jailbroken iOS arm64 (rootless)
          EOF
          sed -i.bak 's/^          //' "$ROOT/DEBIAN/control"
          rm -f "$ROOT/DEBIAN/control.bak"
          dpkg-deb -b -Zxz "$ROOT" "${PKG}_${VER}_iphoneos-arm64.deb"
          ls -lh *.deb
      - uses: actions/upload-artifact@v4
        with:
          name: node-ios-arm64
          path: |
            node-src/out/Release/node
            node-src/*.deb
            node-src/../fixups-report.txt
          retention-days: 30
          if-no-files-found: error

  ipa:
    needs: node
    if: ${{ github.event.inputs.build_ipa == '1' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/download-artifact@v4
        with: { name: node-ios-arm64, path: out-node }
      # 引擎 113MB（压缩后 37MB），不进 git。放 Release（tag 固定为 engine-latest）。
      - name: Fetch engine bundle
        run: |
          set -euxo pipefail
          mkdir -p _stage && cd _stage
          curl -fL --retry 3 -o engine.zip \
            "https://github.com/${{ github.repository }}/releases/download/engine-latest/engine.zip"
          ls -lh engine.zip
          unzip -q engine.zip
          ls
          cd ..
          mkdir -p engine
          cp -a _stage/engine/. engine/
          test -f engine/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js
          du -sh engine
      - name: Assemble unsigned IPA
        env:
          NODE_BIN: ${{ github.workspace }}/out-node/out/Release/node
          ENGINE_DIR: ${{ github.workspace }}/engine
          APP_DIR: ${{ github.workspace }}/app
          OUT_IPA: ${{ github.workspace }}/dist/DSH.ipa
        run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-ipa
          path: dist/
          retention-days: 30